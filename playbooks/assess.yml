---
- name: Assess Patch Exposure
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Get running kernel version
      ansible.builtin.command: uname -r
      register: uname_cmd
      changed_when: false

    - name: Set kernel version fact
      ansible.builtin.set_fact:
        # Avoid colliding with workflow-injected kernel_version strings
        assessed_kernel_version: "{{ uname_cmd.stdout }}"

    - name: Get outstanding security advisories
      ansible.builtin.command: dnf updateinfo list --security
      register: security_advisories
      changed_when: false
      failed_when: false

    - name: Count security advisories
      ansible.builtin.set_fact:
        advisory_count: "{{ security_advisories.stdout_lines | select('search', 'RHSA') | list | length }}"

    - name: Check for CVE-targeted package updates
      ansible.builtin.command: >
        dnf check-update --cve {{ triggered_cve }}
      register: cve_pkg_check
      changed_when: false
      failed_when: false
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: List packages that would update for triggered CVE
      ansible.builtin.shell: >
        dnf check-update --cve {{ triggered_cve }} 2>/dev/null
        | awk '/^[a-zA-Z0-9]/{print $1}'
        | sort -u
      register: cve_pkg_list_cmd
      changed_when: false
      failed_when: false
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: Extract CVE list from advisory for triggered CVE
      ansible.builtin.shell: >
        dnf updateinfo info --cve {{ triggered_cve }} 2>/dev/null
        | grep -oP 'CVE-\d{4}-\d+' | sort -u
      register: cve_extraction
      changed_when: false
      failed_when: false
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: Set CVE list fact
      ansible.builtin.set_fact:
        assessed_cve_list: >-
          {{
            (cve_extraction.stdout_lines | default([]))
            if (cve_extraction.stdout_lines | default([]) | length > 0)
            else ([triggered_cve] if (triggered_cve is defined and triggered_cve | length > 0) else [])
          }}

    - name: Check if triggered CVE has an available fix on this host
      ansible.builtin.set_fact:
        triggered_cve_present: "{{ (cve_pkg_check.rc | default(0)) != 0 }}"
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: Determine whether reboot is required for this fix
      ansible.builtin.set_fact:
        # Kernel/core packages typically need reboot; userland (php, openssl libs via service restart) do not.
        reboot_required_for_fix: >-
          {{
            (cve_pkg_list_cmd.stdout_lines | default([])
              | select('match', '^(kernel|glibc|systemd|linux-firmware)')
              | list | length > 0)
            if (triggered_cve is defined and triggered_cve | length > 0)
            else false
          }}

    - name: Set patch availability facts
      ansible.builtin.set_fact:
        patch_available: >-
          {{
            (triggered_cve is defined and triggered_cve | length > 0 and (cve_pkg_check.rc | default(0)) != 0)
            or (advisory_count | int > 0)
          }}

    - name: Flag triggered CVE status
      ansible.builtin.debug:
        msg: >-
          {% if triggered_cve_present | default(false) | bool %}
          CONFIRMED: {{ triggered_cve }} has a package fix available on {{ inventory_hostname }} —
          upgrade will permanently remediate this CVE
          (reboot {{ 'REQUIRED' if (reboot_required_for_fix | bool) else 'NOT required' }})
          {% else %}
          INFO: {{ triggered_cve | default('N/A') }} has no outstanding package update on {{ inventory_hostname }}
          {% endif %}
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: Check if syft is available
      ansible.builtin.command: syft version
      register: syft_check
      changed_when: false
      failed_when: false

    - name: Generate pre-patch CycloneDX SBOM (syft)
      ansible.builtin.command: >
        syft packages dir:/ --catalogers rpm-db-cataloger
        -o cyclonedx-json
        --file {{ sbom_before_path | default('/tmp/sbom-before.json') }}
      changed_when: true
      when: syft_check.rc == 0

    - name: Generate pre-patch RPM snapshot as SBOM
      ansible.builtin.shell: |
        python3 -c "
        import subprocess, json
        out = subprocess.check_output(['rpm', '-qa', '--qf', '%{NAME}\t%{VERSION}-%{RELEASE}.%{ARCH}\n']).decode()
        comps = [{'name': l.split('\t')[0], 'version': l.split('\t')[1]} for l in out.strip().split('\n') if '\t' in l]
        json.dump({'components': sorted(comps, key=lambda c: c['name'])}, open('{{ sbom_before_path | default('/tmp/sbom-before.json') }}', 'w'), indent=2)
        "
      changed_when: true
      when: syft_check.rc != 0

    - name: Publish assessment data
      ansible.builtin.set_stats:
        data:
          kernel_version: "{{ assessed_kernel_version }}"
          advisory_count: "{{ advisory_count }}"
          patch_available: "{{ patch_available }}"
          reboot_required_for_fix: "{{ reboot_required_for_fix }}"
          cve_list: "{{ assessed_cve_list }}"
          packages_for_cve: "{{ cve_pkg_list_cmd.stdout_lines | default([]) }}"
          sbom_before_path: "{{ sbom_before_path | default('/tmp/sbom-before.json') }}"
          assessment_timestamp: "{{ ansible_date_time.iso8601 }}"
        aggregate: false

    - name: Build assessment summary
      ansible.builtin.set_fact:
        assessment_summary: |
          === Patch Exposure Assessment ===
          Host: {{ inventory_hostname }}
          Kernel: {{ assessed_kernel_version }}
          Security advisories: {{ advisory_count }}
          Related CVEs: {{ assessed_cve_list | length }}
          Packages for triggered CVE: {{ cve_pkg_list_cmd.stdout_lines | default([]) | join(', ') | default('none') }}
          Patch available: {{ patch_available }}
          Reboot required for fix: {{ reboot_required_for_fix }}
          Triggered CVE: {{ triggered_cve | default('N/A') }} — {{ 'FIX AVAILABLE' if (triggered_cve_present | default(false) | bool) else 'not found' }}
          SBOM captured: {{ sbom_before_path | default('/tmp/sbom-before.json') }}

    - name: Display assessment summary
      ansible.builtin.debug:
        msg: "{{ assessment_summary }}"
