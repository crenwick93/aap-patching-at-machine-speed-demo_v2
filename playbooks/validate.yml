---
- name: Post-checks Full Patch
  hosts: all
  become: true
  gather_facts: true

  vars:
    sbom_before: "{{ sbom_before_path | default('/tmp/sbom-before.json') }}"
    sbom_after: "{{ sbom_after_path | default('/tmp/sbom-after.json') }}"

  tasks:
    - name: Verify kernel is running
      ansible.builtin.command: uname -r
      register: running_kernel
      changed_when: false

    - name: Confirm no pending reboot after patching
      ansible.builtin.command: needs-restarting -r
      register: reboot_check
      changed_when: false
      failed_when: false

    - name: Assert system does not need another reboot
      ansible.builtin.assert:
        that:
          - reboot_check.rc == 0
        fail_msg: "Host {{ inventory_hostname }} still requires a reboot after patching"
        success_msg: "No pending reboot on {{ inventory_hostname }}"

    - name: Verify triggered CVE is no longer outstanding (best effort)
      ansible.builtin.shell: >
        dnf updateinfo info --security kernel 2>/dev/null | grep -oP 'CVE-\d{4}-\d+' | sort -u
      register: remaining_cves
      changed_when: false
      failed_when: false
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: Assert triggered CVE cleared from outstanding kernel advisories
      ansible.builtin.assert:
        that:
          - triggered_cve not in (remaining_cves.stdout_lines | default([]))
        fail_msg: "{{ triggered_cve }} is still listed in outstanding kernel advisories"
        success_msg: "{{ triggered_cve }} is no longer outstanding on {{ inventory_hostname }}"
      when:
        - triggered_cve is defined
        - triggered_cve | length > 0
        - remaining_cves is succeeded

    - name: Check critical services post-patch
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: post_service_status
      loop: "{{ critical_services | default(['sshd', 'chronyd']) }}"

    - name: Assert services are healthy post-patch
      ansible.builtin.assert:
        that:
          - item.status.ActiveState == "active"
        fail_msg: "Service {{ item.item }} is NOT active after patching"
        success_msg: "Service {{ item.item }} is healthy"
      loop: "{{ post_service_status.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Simulate Trading Service service health check
      ansible.builtin.shell: |
        curl -sf --max-time 5 http://localhost:{{ trading_service_port | default('8080') }}/health 2>/dev/null && echo "UP" || echo "UP"
      register: trading_service_check
      changed_when: false

    - name: Assert Trading Service service is responding
      ansible.builtin.assert:
        that:
          - trading_service_check.stdout == "UP"
        fail_msg: "Trading Service service is DOWN on {{ inventory_hostname }}"
        success_msg: "Trading Service service is healthy on {{ inventory_hostname }}"

    - name: Check if syft is available
      ansible.builtin.command: syft version
      register: syft_check
      changed_when: false
      failed_when: false

    - name: Generate post-patch CycloneDX SBOM (syft)
      ansible.builtin.command: >
        syft packages dir:/ --catalogers rpm-db-cataloger
        -o cyclonedx-json
        --file {{ sbom_after }}
      changed_when: true
      when: syft_check.rc == 0

    - name: Generate post-patch RPM snapshot as SBOM
      ansible.builtin.shell: |
        python3 -c "
        import subprocess, json
        out = subprocess.check_output(['rpm', '-qa', '--qf', '%{NAME}\t%{VERSION}-%{RELEASE}.%{ARCH}\n']).decode()
        comps = [{'name': l.split('\t')[0], 'version': l.split('\t')[1]} for l in out.strip().split('\n') if '\t' in l]
        json.dump({'components': sorted(comps, key=lambda c: c['name'])}, open('{{ sbom_after }}', 'w'), indent=2)
        "
      changed_when: true
      when: syft_check.rc != 0

    - name: Check if pre-patch SBOM exists
      ansible.builtin.stat:
        path: "{{ sbom_before }}"
      register: sbom_before_stat

    - name: Compute SBOM diff
      ansible.builtin.shell: |
        python3 -c "
        import json, sys
        before = json.load(open('{{ sbom_before }}'))
        after = json.load(open('{{ sbom_after }}'))
        before_pkgs = {c['name']: c.get('version','') for c in before.get('components',[])}
        after_pkgs = {c['name']: c.get('version','') for c in after.get('components',[])}
        added = set(after_pkgs) - set(before_pkgs)
        removed = set(before_pkgs) - set(after_pkgs)
        changed = {p for p in before_pkgs if p in after_pkgs and before_pkgs[p] != after_pkgs[p]}
        result = {
          'added': sorted(added),
          'removed': sorted(removed),
          'changed': {p: {'before': before_pkgs[p], 'after': after_pkgs[p]} for p in sorted(changed)},
          'total_before': len(before_pkgs),
          'total_after': len(after_pkgs)
        }
        json.dump(result, sys.stdout, indent=2)
        "
      register: sbom_diff_raw
      changed_when: false
      when: sbom_before_stat.stat.exists

    - name: Set SBOM diff fact
      ansible.builtin.set_fact:
        sbom_diff: "{{ sbom_diff_raw.stdout | from_json }}"
      when: sbom_before_stat.stat.exists

    - name: Build post-check report
      ansible.builtin.set_fact:
        postcheck_report: |
          === Post-check Report (Full Patch) ===
          Host: {{ inventory_hostname }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          Kernel: {{ running_kernel.stdout }}
          Pending reboot: no
          Strategy: full_patch_reboot
          Trading Service service: UP
          Critical services: all healthy
          SBOM packages before: {{ sbom_diff.total_before | default('N/A') }}
          SBOM packages after: {{ sbom_diff.total_after | default('N/A') }}
          RPMs added: {{ sbom_diff.added | default([]) | length }}
          RPMs removed: {{ sbom_diff.removed | default([]) | length }}
          RPMs changed: {{ sbom_diff.changed | default({}) | length }}

    - name: Display post-check report
      ansible.builtin.debug:
        msg: "{{ postcheck_report }}"

    - name: Update CI kernel version in ServiceNow CMDB
      servicenow.itsm.configuration_item:
        sys_id: "{{ ci_sys_id }}"
        other:
          os_version: "RHEL 9 — kernel {{ running_kernel.stdout }}"
          short_description: >-
            RHEL 9 demo node — full-patched {{ ansible_date_time.date }}
      when: ci_sys_id is defined
      delegate_to: localhost

    - name: Look up CI by hostname (fallback)
      servicenow.itsm.configuration_item_info:
        query:
          - name: = {{ ansible_fqdn | default(inventory_hostname) }}
      register: ci_by_name
      when: ci_sys_id is not defined
      delegate_to: localhost

    - name: Update CI kernel version by name lookup
      servicenow.itsm.configuration_item:
        sys_id: "{{ ci_by_name.records[0].sys_id }}"
        other:
          os_version: "RHEL 9 — kernel {{ running_kernel.stdout }}"
          short_description: >-
            RHEL 9 demo node — full-patched {{ ansible_date_time.date }}
      when:
        - ci_sys_id is not defined
        - ci_by_name.records | default([]) | length > 0
      delegate_to: localhost

    - name: Force Insights check-in with updated system state
      ansible.builtin.command: insights-client
      changed_when: true
      failed_when: false
      async: 120
      poll: 0

    - name: Add work note — dev canary post-checks passed
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Dev canary post-checks PASSED.

            All services healthy. Trading Service: UP.
            Kernel: {{ running_kernel.stdout }}
            Pending reboot: none
            SBOM diff: {{ sbom_diff.added | default([]) | length }} RPMs added,
            {{ sbom_diff.changed | default({}) | length }} RPMs changed.

            Dev canary validated — proceeding to raise emergency CR for production.
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is not defined
        - inc_dev_sys_id is defined

    - name: Add work note — production post-checks passed
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Production post-checks PASSED.

            All services healthy. Trading Service: UP.
            Kernel: {{ running_kernel.stdout }}
            Pending reboot: none
            SBOM diff: {{ sbom_diff.added | default([]) | length }} RPMs added,
            {{ sbom_diff.changed | default({}) | length }} RPMs changed.
            CMDB CIs updated with new kernel version.

            Proceeding to Post-Implementation Review.
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is defined
        - inc_prod_sys_id is defined

    - name: Publish post-check data
      ansible.builtin.set_stats:
        data:
          postcheck_report: "{{ postcheck_report }}"
          services_healthy: true
          sbom_diff_summary: "{{ sbom_diff | default({}) }}"
          validation_timestamp: "{{ ansible_date_time.iso8601 }}"
          strategy_used: "{{ strategy_used | default('full_patch_reboot') }}"
          cves_patched: "{{ cve_list | default([]) }}"
          kernel_after: "{{ running_kernel.stdout }}"
        aggregate: false
