---
- name: Post-checks Full Patch
  hosts: all
  become: true
  gather_facts: true

  vars:
    sbom_before: "{{ sbom_before_path | default('/tmp/sbom-before.json') }}"
    sbom_after: "{{ sbom_after_path | default('/tmp/sbom-after.json') }}"
    app_port: "{{ trading_service_port | default(80) }}"
    critical_services: "{{ precheck_critical_services | default(['sshd', 'chronyd', 'httpd']) }}"

  tasks:
    - name: Verify kernel is running
      ansible.builtin.command: uname -r
      register: running_kernel_cmd
      changed_when: false

    - name: Capture PHP package version
      ansible.builtin.command: rpm -q php
      register: php_rpm_cmd
      changed_when: false
      failed_when: false

    - name: Confirm no pending reboot after patching
      ansible.builtin.command: needs-restarting -r
      register: reboot_check_cmd
      changed_when: false
      failed_when: false

    - name: Assert system does not need another reboot
      ansible.builtin.assert:
        that:
          - reboot_check_cmd.rc == 0
        fail_msg: "Host {{ inventory_hostname }} still requires a reboot after patching"
        success_msg: "No pending reboot on {{ inventory_hostname }}"

    - name: Verify triggered CVE is no longer outstanding (best effort)
      ansible.builtin.command: >
        dnf check-update --cve {{ triggered_cve }}
      register: remaining_cve_check
      changed_when: false
      failed_when: false
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: Assert triggered CVE has no remaining package updates
      ansible.builtin.assert:
        that:
          - (remaining_cve_check.rc | default(0)) == 0
        fail_msg: "{{ triggered_cve }} still has outstanding package updates on {{ inventory_hostname }}"
        success_msg: "{{ triggered_cve }} has no outstanding package updates on {{ inventory_hostname }}"
      when:
        - triggered_cve is defined
        - triggered_cve | length > 0
        - remaining_cve_check is not skipped

    - name: Check critical services post-patch
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: post_service_status
      loop: "{{ critical_services }}"

    - name: Assert services are healthy post-patch
      ansible.builtin.assert:
        that:
          - item.status.ActiveState == "active"
        fail_msg: "Service {{ item.item }} is NOT active after patching"
        success_msg: "Service {{ item.item }} is healthy"
      loop: "{{ post_service_status.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Query Trading Service /health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        method: GET
        return_content: true
        status_code: 200
        timeout: 5
      register: trading_health
      failed_when: false

    - name: Query Trading Service home page
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/"
        method: GET
        return_content: true
        status_code: 200
        timeout: 5
      register: trading_home
      failed_when: false

    - name: Assert Trading Service is healthy
      ansible.builtin.assert:
        that:
          - trading_health.status | default(0) == 200
          - (trading_health.json.status | default('')) == 'UP'
            or ('"status":"UP"' in (trading_health.content | default('')))
            or ('UP' in (trading_health.content | default('')))
        fail_msg: >-
          Trading Service health check FAILED on {{ inventory_hostname }}
          (HTTP {{ trading_health.status | default('n/a') }})
        success_msg: "Trading Service is UP on {{ inventory_hostname }}"

    - name: Check if syft is available
      ansible.builtin.command: syft version
      register: syft_check
      changed_when: false
      failed_when: false

    - name: Generate post-patch CycloneDX SBOM (syft)
      ansible.builtin.command: >
        syft packages dir:/ --catalogers rpm-db-cataloger
        -o cyclonedx-json
        --file {{ sbom_after }}
      changed_when: true
      when: syft_check.rc == 0

    - name: Generate post-patch RPM snapshot as SBOM
      ansible.builtin.shell: |
        python3 -c "
        import subprocess, json
        out = subprocess.check_output(['rpm', '-qa', '--qf', '%{NAME}\t%{VERSION}-%{RELEASE}.%{ARCH}\n']).decode()
        comps = [{'name': l.split('\t')[0], 'version': l.split('\t')[1]} for l in out.strip().split('\n') if '\t' in l]
        json.dump({'components': sorted(comps, key=lambda c: c['name'])}, open('{{ sbom_after }}', 'w'), indent=2)
        "
      changed_when: true
      when: syft_check.rc != 0

    - name: Check if pre-patch SBOM exists
      ansible.builtin.stat:
        path: "{{ sbom_before }}"
      register: sbom_before_stat

    - name: Compute SBOM diff
      ansible.builtin.shell: |
        python3 -c "
        import json, sys
        before = json.load(open('{{ sbom_before }}'))
        after = json.load(open('{{ sbom_after }}'))
        before_pkgs = {c['name']: c.get('version','') for c in before.get('components',[])}
        after_pkgs = {c['name']: c.get('version','') for c in after.get('components',[])}
        added = set(after_pkgs) - set(before_pkgs)
        removed = set(before_pkgs) - set(after_pkgs)
        changed = {p for p in before_pkgs if p in after_pkgs and before_pkgs[p] != after_pkgs[p]}
        result = {
          'added': sorted(added),
          'removed': sorted(removed),
          'changed': {p: {'before': before_pkgs[p], 'after': after_pkgs[p]} for p in sorted(changed)},
          'total_before': len(before_pkgs),
          'total_after': len(after_pkgs)
        }
        json.dump(result, sys.stdout, indent=2)
        "
      register: sbom_diff_raw
      changed_when: false
      when: sbom_before_stat.stat.exists

    - name: Set SBOM diff fact
      ansible.builtin.set_fact:
        sbom_diff: "{{ sbom_diff_raw.stdout | from_json }}"
      when: sbom_before_stat.stat.exists

    - name: Build SBOM upgrade lines (before → after)
      ansible.builtin.set_fact:
        sbom_upgrade_detail: |
          {% for item in ((sbom_diff | default({})).changed | default({}) | dict2items) %}
          {{ item.key }}: {{ item.value.before }}  →  {{ item.value.after }}
          {% else %}
          (no package version changes recorded in SBOM diff)
          {% endfor %}

    - name: Set per-host validation facts
      ansible.builtin.set_fact:
        host_validation:
          host: "{{ inventory_hostname }}"
          fqdn: "{{ ansible_fqdn | default(inventory_hostname) }}"
          kernel: "{{ running_kernel_cmd.stdout }}"
          php_rpm: "{{ php_rpm_cmd.stdout | default('php not installed') }}"
          pending_reboot: false
          reboot_performed: "{{ reboot_performed | default(false) }}"
          services: >-
            {{
              dict(
                post_service_status.results
                | map(attribute='item')
                | list
                | zip(
                    post_service_status.results
                    | map(attribute='status')
                    | map(attribute='ActiveState')
                    | list
                  )
              )
            }}
          trading_service:
            health_http: "{{ trading_health.status | default('n/a') }}"
            health_body: "{{ trading_health.json | default(trading_health.content | default('')) }}"
            home_http: "{{ trading_home.status | default('n/a') }}"
            status: UP
          cve_cleared: >-
            {{
              (triggered_cve is not defined)
              or (triggered_cve | length == 0)
              or ((remaining_cve_check.rc | default(0)) == 0)
            }}
          triggered_cve: "{{ triggered_cve | default('N/A') }}"
          sbom:
            before_file: "{{ sbom_before }}"
            after_file: "{{ sbom_after }}"
            added: "{{ (sbom_diff | default({})).added | default([]) | length }}"
            removed: "{{ (sbom_diff | default({})).removed | default([]) | length }}"
            changed: "{{ (sbom_diff | default({})).changed | default({}) | length }}"
            changed_packages: "{{ ((sbom_diff | default({})).changed | default({})).keys() | list }}"
            upgrade_detail: "{{ sbom_upgrade_detail }}"
          result: PASS
          timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Build post-check report
      ansible.builtin.set_fact:
        postcheck_report: |
          === Post-check Report (Package Patch) ===
          Host: {{ inventory_hostname }} ({{ ansible_fqdn | default(inventory_hostname) }})
          Timestamp: {{ ansible_date_time.iso8601 }}
          Result: PASS
          Kernel: {{ running_kernel_cmd.stdout }}
          PHP RPM: {{ php_rpm_cmd.stdout | default('n/a') }}
          Pending reboot: no
          Reboot performed: {{ reboot_performed | default('n/a') }}
          Strategy: {{ strategy_used | default('package_upgrade') }}
          Triggered CVE cleared: {{ host_validation.cve_cleared }}
          Critical services: {{ host_validation.services }}
          Trading Service /health: HTTP {{ trading_health.status | default('n/a') }} — UP
          Trading Service /: HTTP {{ trading_home.status | default('n/a') }}
          SBOM baseline file: {{ sbom_before }}
          SBOM after file:    {{ sbom_after }}
          SBOM: +{{ sbom_diff.added | default([]) | length }} / -{{ sbom_diff.removed | default([]) | length }} / ~{{ sbom_diff.changed | default({}) | length }}
          Package upgrades verified (installed → fixed):
          {{ sbom_upgrade_detail }}

    - name: Display post-check report
      ansible.builtin.debug:
        msg: "{{ postcheck_report }}"

    - name: Update CI OS version in ServiceNow CMDB
      servicenow.itsm.configuration_item:
        sys_id: "{{ ci_sys_id }}"
        other:
          os_version: "RHEL 9 — kernel {{ running_kernel_cmd.stdout }}"
          short_description: >-
            RHEL 9 demo node — patched {{ ansible_date_time.date }}
      when: ci_sys_id is defined
      delegate_to: localhost

    - name: Look up CI by hostname (fallback)
      servicenow.itsm.configuration_item_info:
        query:
          - name: = {{ ansible_fqdn | default(inventory_hostname) }}
      register: ci_by_name
      when: ci_sys_id is not defined
      delegate_to: localhost

    - name: Update CI OS version by name lookup
      servicenow.itsm.configuration_item:
        sys_id: "{{ ci_by_name.records[0].sys_id }}"
        other:
          os_version: "RHEL 9 — kernel {{ running_kernel_cmd.stdout }}"
          short_description: >-
            RHEL 9 demo node — patched {{ ansible_date_time.date }}
      when:
        - ci_sys_id is not defined
        - ci_by_name.records | default([]) | length > 0
      delegate_to: localhost

    - name: Force Insights check-in with updated system state
      ansible.builtin.command: insights-client
      changed_when: true
      failed_when: false
      async: 120
      poll: 0

    - name: Aggregate canary evidence (ServiceNow [code]/HTML for work notes)
      ansible.builtin.set_fact:
        canary_evidence: "{{ lookup('template', 'templates/snow/canary_evidence.j2') }}"
      run_once: true

    - name: Add work note — canary / stage post-checks passed
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id if (cr_number is not defined) else inc_prod_sys_id }}"
        other:
          work_notes: "{{ canary_evidence }}"
      delegate_to: localhost
      become: false
      run_once: true
      when: >
        (cr_number is not defined and inc_dev_sys_id is defined)
        or (cr_number is defined and inc_prod_sys_id is defined)

    - name: Publish post-check data
      ansible.builtin.set_stats:
        data:
          postcheck_report: "{{ postcheck_report }}"
          canary_evidence: "{{ canary_evidence }}"
          canary_result: PASS
          canary_recommendation: "SAFE TO DEPLOY TO PRODUCTION"
          services_healthy: true
          trading_service_up: true
          sbom_diff_summary: "{{ sbom_diff | default({}) }}"
          sbom_before_path: "{{ sbom_before }}"
          sbom_after_path: "{{ sbom_after }}"
          validation_timestamp: "{{ ansible_date_time.iso8601 }}"
          strategy_used: "{{ strategy_used | default('package_upgrade') }}"
          cves_patched: "{{ cve_list | default([]) }}"
          kernel_after: "{{ running_kernel_cmd.stdout }}"
          php_after: "{{ php_rpm_cmd.stdout | default('') }}"
          reboot_performed: "{{ reboot_performed | default(false) }}"
        aggregate: false
      run_once: true
