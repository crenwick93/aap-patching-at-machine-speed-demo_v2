---
- name: Post-Implementation Review
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Build validation summary for incidents
      ansible.builtin.set_fact:
        validation_work_note: |
          [code]
          <h3>Post-Implementation Review</h3>
          <p>All post-checks passed across patched hosts.</p>
          <ul>
            <li><b>Strategy:</b> {{ strategy_used | default('package_upgrade') }}</li>
            <li><b>Services healthy:</b> {{ services_healthy | default('yes') }}</li>
            <li><b>Trading Service:</b> UP</li>
            <li><b>PHP after:</b> <code>{{ php_after | default('see host reports') }}</code></li>
            <li><b>Reboot performed:</b> {{ reboot_performed | default('n/a') }}</li>
            <li><b>Kernel impact:</b> {{ kernel_impact_note | default('KERNEL UNCHANGED') | e }}</li>
          </ul>
          <p><b>SBOM diff:</b>
          +{{ sbom_diff_summary.added | default([]) | length }} /
          −{{ sbom_diff_summary.removed | default([]) | length }} /
          ~{{ sbom_diff_summary.changed | default({}) | length }}</p>
          <p>Permanent package upgrade applied — Insights clears on next evaluation
          after the updated RPM set is reported (no manual CVE status API).</p>
          [/code]

    - name: Update Dev Incident with post-check results
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        other:
          work_notes: "{{ validation_work_note }}"
      when: inc_dev_sys_id is defined and inc_dev_sys_id | length > 0

    - name: Update Prod Incident with post-check results
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: "{{ validation_work_note }}"
      when: inc_prod_sys_id is defined and inc_prod_sys_id | length > 0

    - name: Resolve Dev Incident
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        state: resolved
        close_code: "Solved (Permanently)"
        close_notes: >-
          Dev canary package upgrade validated successfully. All dev services healthy.
          Trading Service confirmed UP. CIs updated in CMDB.
          Reboot performed: {{ reboot_performed | default('n/a') }}.
      when: inc_dev_sys_id is defined and inc_dev_sys_id | length > 0

    - name: Resolve Prod Incident
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        state: resolved
        close_code: "Solved (Permanently)"
        close_notes: >-
          Production package upgrade validated successfully. All production services healthy.
          Trading Service confirmed UP. CIs updated in CMDB. Permanent fix applied —
          no follow-up CR required. Reboot performed: {{ reboot_performed | default('n/a') }}.
      when: inc_prod_sys_id is defined and inc_prod_sys_id | length > 0

    - name: Build review notes
      ansible.builtin.set_fact:
        review_notes: |
          [code]
          <h3>Production patching complete — ready for human review</h3>
          <ul>
            <li><b>Strategy:</b> {{ strategy_used | default('package_upgrade') }}</li>
            <li><b>CVEs patched:</b> {{ cves_patched | default([]) | join(', ') }}</li>
            <li><b>Services healthy:</b> {{ services_healthy | default('unknown') }}</li>
            <li><b>Trading Service:</b> UP (all environments)</li>
            <li><b>PHP after:</b> <code>{{ php_after | default('see host reports') }}</code></li>
            <li><b>Reboot performed:</b> {{ reboot_performed | default('n/a') }}</li>
            <li><b>Kernel impact:</b> {{ kernel_impact_note | default('KERNEL UNCHANGED') | e }}</li>
            <li><b>SBOM:</b> +{{ sbom_diff_summary.added | default([]) | length }} /
              −{{ sbom_diff_summary.removed | default([]) | length }} /
              ~{{ sbom_diff_summary.changed | default({}) | length }}</li>
          </ul>
          <p>Insights: package set updated — scanner clears on next evaluation
          (no manual CVE status API in this full-patch workflow).<br>
          Dev + Prod incidents resolved. CMDB CIs updated.
          Follow-up CR: <b>none</b> (this remediation is the permanent fix).</p>
          [/code]

    - name: Move CR to Review
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: review
        other:
          work_notes: "{{ review_notes }}"
      when: cr_sys_id is defined and cr_sys_id | length > 0

    - name: Display PIR summary
      ansible.builtin.debug:
        msg: |
          === Post-Implementation Review Complete ===
          Dev Incident {{ inc_dev_number | default('?') }}: resolved
          Prod Incident {{ inc_prod_number | default('?') }}: resolved
          Emergency CR {{ cr_number | default('?') }}: moved to Review
          Follow-up CR: none (permanent fix applied)

    - name: Publish PIR data
      ansible.builtin.set_stats:
        data:
          pir_complete: true
          followup_cr_number: none
        aggregate: false
