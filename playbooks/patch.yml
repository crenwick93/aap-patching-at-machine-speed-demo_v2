---
- name: Apply Full Patch
  hosts: all
  become: true
  gather_facts: true

  vars:
    # CVE-targeted by default (matches Insights story). Set patch_security_only=true
    # without triggered_cve for a broader security update.
    patch_security_only: true
    reboot_timeout: "{{ patch_reboot_timeout | default(600) }}"
    post_reboot_delay: "{{ patch_post_reboot_delay | default(30) }}"

  tasks:
    - name: Add work note — applying full patch to dev canary
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Applying full package patch + reboot to dev canary nodes.

            Strategy: dnf security upgrade + reboot (permanent fix)
            Target hosts: rhel-dev-01, rhel-dev-02, rhel-dev-03
            Triggered CVE: {{ triggered_cve | default('N/A') }}
            AAP Workflow Job: {{ tower_workflow_job_id | default(awx_workflow_job_id | default('N/A')) }}

            Expected impact: brief reboot window per host.
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is not defined
        - inc_dev_sys_id is defined

    - name: Add work note — CR approved, applying full patch to production
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Emergency CR {{ cr_number }} has been approved.
            Applying full package patch + reboot to production nodes now.

            Strategy: dnf security upgrade + reboot (permanent fix)
            Target hosts: rhel-prod-01, rhel-prod-02, rhel-prod-03
            AAP Workflow Job: {{ tower_workflow_job_id | default(awx_workflow_job_id | default('N/A')) }}
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is defined
        - inc_prod_sys_id is defined

    - name: Capture pre-patch kernel version
      ansible.builtin.command: uname -r
      register: kernel_before
      changed_when: false

    - name: Check for updates matching triggered CVE
      ansible.builtin.command: >
        dnf check-update --cve {{ triggered_cve }}
      register: cve_check
      changed_when: false
      failed_when: false
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: Apply CVE-targeted package upgrade
      ansible.builtin.command: >
        dnf upgrade -y --cve {{ triggered_cve }}
      register: cve_upgrade
      changed_when: "'Nothing to do' not in cve_upgrade.stdout"
      when:
        - triggered_cve is defined
        - triggered_cve | length > 0
        - (cve_check.rc | default(100)) != 0

    - name: Apply security package upgrades (fallback / broad path)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: "{{ patch_security_only | bool }}"
        update_cache: true
      register: security_upgrade
      when: >
        triggered_cve is not defined
        or triggered_cve | length == 0
        or (cve_check.rc | default(0)) == 0

    - name: Determine whether reboot is required
      ansible.builtin.command: needs-restarting -r
      register: reboot_needed
      changed_when: false
      failed_when: false

    - name: Reboot host to activate patched packages
      ansible.builtin.reboot:
        msg: "AAP full-patch remediation — rebooting to activate updates"
        reboot_timeout: "{{ reboot_timeout | int }}"
        post_reboot_delay: "{{ post_reboot_delay | int }}"
      when: reboot_needed.rc != 0 or (cve_upgrade is changed) or (security_upgrade is changed)
      register: reboot_result

    - name: Capture post-patch kernel version
      ansible.builtin.command: uname -r
      register: kernel_after
      changed_when: false

    - name: Confirm no pending reboot remains
      ansible.builtin.command: needs-restarting -r
      register: reboot_clear
      changed_when: false
      failed_when: false

    - name: Assert system is fully restarted after patching
      ansible.builtin.assert:
        that:
          - reboot_clear.rc == 0
        fail_msg: "Host {{ inventory_hostname }} still reports a pending reboot after patching"
        success_msg: "Host {{ inventory_hostname }} has no pending reboot"

    - name: Publish patch results
      ansible.builtin.set_stats:
        data:
          patch_result: success
          strategy_used: full_patch_reboot
          cves_patched: "{{ [triggered_cve] if (triggered_cve is defined and triggered_cve | length > 0) else (cve_list | default([])) }}"
          kernel_before: "{{ kernel_before.stdout }}"
          kernel_after: "{{ kernel_after.stdout }}"
          reboot_performed: "{{ reboot_result is changed }}"
          patch_timestamp: "{{ ansible_date_time.iso8601 }}"
        aggregate: false

    - name: Display patch summary
      ansible.builtin.debug:
        msg: |
          === Full Patch Applied ===
          Host: {{ inventory_hostname }}
          Kernel before: {{ kernel_before.stdout }}
          Kernel after:  {{ kernel_after.stdout }}
          Reboot performed: {{ reboot_result is changed }}
          Strategy: permanent package update + reboot

    - name: Add work note — full patch successfully applied to dev canary
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Full patch + reboot successfully applied to all dev canary nodes.

            Strategy: dnf security upgrade + reboot
            Kernel transition: {{ kernel_before.stdout }} → {{ kernel_after.stdout }}
            Patch result: SUCCESS

            Proceeding to raise emergency CR for production deployment.
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is not defined
        - inc_dev_sys_id is defined

    - name: Add work note — full patch successfully applied to production
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Full patch + reboot successfully applied to all production nodes.

            Strategy: dnf security upgrade + reboot
            Kernel transition: {{ kernel_before.stdout }} → {{ kernel_after.stdout }}
            Patch result: SUCCESS

            Running post-implementation checks now.
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is defined
        - inc_prod_sys_id is defined
