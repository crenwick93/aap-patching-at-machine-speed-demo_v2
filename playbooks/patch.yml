---
- name: Apply Full Patch
  hosts: all
  become: true
  gather_facts: true

  vars:
    # CVE-targeted by default (matches Insights story). Set patch_security_only=true
    # without triggered_cve for a broader security update.
    patch_security_only: true
    reboot_timeout: "{{ patch_reboot_timeout | default(600) }}"
    post_reboot_delay: "{{ patch_post_reboot_delay | default(30) }}"
    # Workflow artifacts may inject kernel_before/kernel_after as strings from a prior
    # node — never register under those names or set_stats will see UnsafeText, not .stdout.
    force_reboot: false

  tasks:
    - name: Add work note — applying package patch to dev canary
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Applying CVE-targeted package upgrade to dev canary nodes.

            Strategy: dnf upgrade --cve (permanent fix); reboot only if needs-restarting requires it
            Target hosts: rhel-dev-01, rhel-dev-02, rhel-dev-03
            Triggered CVE: {{ triggered_cve | default('N/A') }}
            Reboot expected: {{ reboot_required_for_fix | default('assessed at runtime') }}
            AAP Workflow Job: {{ tower_workflow_job_id | default(awx_workflow_job_id | default('N/A')) }}
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is not defined
        - inc_dev_sys_id is defined

    - name: Add work note — CR approved, applying package patch to production
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Emergency CR {{ cr_number }} has been approved.
            Applying CVE-targeted package upgrade to production nodes now.

            Strategy: dnf upgrade --cve (permanent fix); reboot only if needs-restarting requires it
            Target hosts: rhel-prod-01, rhel-prod-02, rhel-prod-03
            Reboot expected: {{ reboot_required_for_fix | default('assessed at runtime') }}
            AAP Workflow Job: {{ tower_workflow_job_id | default(awx_workflow_job_id | default('N/A')) }}
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is defined
        - inc_prod_sys_id is defined

    - name: Capture pre-patch kernel version
      ansible.builtin.command: uname -r
      register: uname_before_cmd
      changed_when: false

    - name: Check for updates matching triggered CVE
      ansible.builtin.command: >
        dnf check-update --cve {{ triggered_cve }}
      register: cve_check
      changed_when: false
      failed_when: false
      when: triggered_cve is defined and triggered_cve | length > 0

    - name: Apply CVE-targeted package upgrade
      ansible.builtin.command: >
        dnf upgrade -y --cve {{ triggered_cve }}
      register: cve_upgrade
      changed_when: "'Nothing to do' not in cve_upgrade.stdout"
      when:
        - triggered_cve is defined
        - triggered_cve | length > 0
        - (cve_check.rc | default(100)) != 0

    - name: Apply security package upgrades (fallback / broad path)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: "{{ patch_security_only | bool }}"
        update_cache: true
      register: security_upgrade
      when: >
        triggered_cve is not defined
        or triggered_cve | length == 0
        or (cve_check.rc | default(0)) == 0

    - name: List services that need restarting after package update
      ansible.builtin.command: needs-restarting -s
      register: services_need_restart
      changed_when: false
      failed_when: false

    - name: Restart services affected by package updates
      ansible.builtin.systemd:
        name: "{{ item | regex_replace('\\.service$', '') }}"
        state: restarted
      loop: "{{ services_need_restart.stdout_lines | default([]) | reject('equalto', '') | list }}"
      when: (services_need_restart.stdout_lines | default([]) | length) > 0
      failed_when: false
      loop_control:
        label: "{{ item }}"

    - name: Determine whether reboot is required
      ansible.builtin.command: needs-restarting -r
      register: reboot_needed_cmd
      changed_when: false
      failed_when: false

    - name: Reboot host only when core libraries require it
      ansible.builtin.reboot:
        msg: "AAP package remediation — rebooting to activate updates"
        reboot_timeout: "{{ reboot_timeout | int }}"
        post_reboot_delay: "{{ post_reboot_delay | int }}"
      when: (reboot_needed_cmd.rc | default(0)) != 0 or (force_reboot | bool)
      register: reboot_cmd_result

    - name: Capture post-patch kernel version
      ansible.builtin.command: uname -r
      register: uname_after_cmd
      changed_when: false

    - name: Confirm no pending reboot remains
      ansible.builtin.command: needs-restarting -r
      register: reboot_clear_cmd
      changed_when: false
      failed_when: false

    - name: Assert system has no outstanding reboot requirement
      ansible.builtin.assert:
        that:
          - reboot_clear_cmd.rc == 0
        fail_msg: >-
          Host {{ inventory_hostname }} still reports a pending reboot after patching.
          Reboot was {{ 'performed' if (reboot_cmd_result is changed) else 'skipped' }}.
        success_msg: "Host {{ inventory_hostname }} has no pending reboot"

    - name: Publish patch results
      ansible.builtin.set_stats:
        data:
          patch_result: success
          strategy_used: package_upgrade
          cves_patched: "{{ [triggered_cve] if (triggered_cve is defined and triggered_cve | length > 0) else (cve_list | default([])) }}"
          kernel_before: "{{ uname_before_cmd.stdout }}"
          kernel_after: "{{ uname_after_cmd.stdout }}"
          reboot_required: "{{ (reboot_needed_cmd.rc | default(0)) != 0 }}"
          reboot_performed: "{{ reboot_cmd_result is changed }}"
          services_restarted: "{{ services_need_restart.stdout_lines | default([]) }}"
          patch_timestamp: "{{ ansible_date_time.iso8601 }}"
        aggregate: false

    - name: Display patch summary
      ansible.builtin.debug:
        msg: |
          === Package Patch Applied ===
          Host: {{ inventory_hostname }}
          Kernel before: {{ uname_before_cmd.stdout }}
          Kernel after:  {{ uname_after_cmd.stdout }}
          Reboot required: {{ (reboot_needed_cmd.rc | default(0)) != 0 }}
          Reboot performed: {{ reboot_cmd_result is changed }}
          Services restarted: {{ services_need_restart.stdout_lines | default([]) | join(', ') | default('none') }}
          Strategy: CVE-targeted package upgrade (reboot only if required)

    - name: Add work note — package patch successfully applied to dev canary
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Package patch successfully applied to all dev canary nodes.

            Strategy: dnf upgrade --cve (permanent fix)
            Kernel: {{ uname_before_cmd.stdout }} → {{ uname_after_cmd.stdout }}
            Reboot performed: {{ reboot_cmd_result is changed }}
            Patch result: SUCCESS

            Proceeding to raise emergency CR for production deployment.
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is not defined
        - inc_dev_sys_id is defined

    - name: Add work note — package patch successfully applied to production
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Package patch successfully applied to all production nodes.

            Strategy: dnf upgrade --cve (permanent fix)
            Kernel: {{ uname_before_cmd.stdout }} → {{ uname_after_cmd.stdout }}
            Reboot performed: {{ reboot_cmd_result is changed }}
            Patch result: SUCCESS

            Running post-implementation checks now.
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - cr_number is defined
        - inc_prod_sys_id is defined
