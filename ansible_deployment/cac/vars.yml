---
# =============================================================================
# AAP Configuration as Code — Trading Service: CVE Full Patch Response
# Full package upgrade + reboot (sibling of the kpatch machine-speed demo)
# =============================================================================

aap_organization: "Security"

# -----------------------------------------------------------------------------
# Organizations
# -----------------------------------------------------------------------------
controller_organizations:
  - name: "{{ aap_organization }}"
    description: "Security automation — CVE response, patching, and ITSM governance demos"

# -----------------------------------------------------------------------------
# Custom Credential Types
# -----------------------------------------------------------------------------
controller_credential_types:
  - name: "Lightspeed API Credential"
    description: "OAuth2 client credentials for Red Hat Lightspeed / Insights APIs"
    kind: cloud
    inputs:
      fields:
        - id: lightspeed_client_id
          type: string
          label: "Client ID"
        - id: lightspeed_client_secret
          type: string
          label: "Client Secret"
          secret: true
    injectors:
      env:
        LIGHTSPEED_CLIENT_ID: !unsafe "{{ lightspeed_client_id }}"
        LIGHTSPEED_CLIENT_SECRET: !unsafe "{{ lightspeed_client_secret }}"

# -----------------------------------------------------------------------------
# Credentials
# -----------------------------------------------------------------------------
controller_credentials:
  - name: "Demo SSH Key"
    description: "SSH access to demo EC2 instances (ec2-user)"
    organization: "{{ aap_organization }}"
    credential_type: "Machine"
    inputs:
      username: ec2-user
      ssh_key_data: "{{ probe_ssh_key }}"

  - name: "AWS Demo"
    description: "AWS credentials for dynamic EC2 inventory discovery"
    organization: "{{ aap_organization }}"
    credential_type: "Amazon Web Services"
    inputs:
      username: "{{ aws_access_key }}"
      password: "{{ aws_secret_key }}"

  - name: "ServiceNow PDI"
    description: "ServiceNow developer instance for ITSM integration"
    organization: "{{ aap_organization }}"
    credential_type: "ServiceNow Credential"
    inputs:
      SN_HOST: "{{ servicenow_instance_url }}"
      SN_USERNAME: "{{ servicenow_username }}"
      SN_PASSWORD: "{{ servicenow_password }}"

  - name: "AAP Controller"
    description: "Controller credential for internal workflow approval automation"
    organization: "{{ aap_organization }}"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ aap_internal_host }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "Lightspeed API Full Patch"
    description: "Lightspeed/Insights API — used to update CVE status in PIR"
    organization: "{{ aap_organization }}"
    credential_type: "Lightspeed API Credential"
    inputs:
      lightspeed_client_id: "{{ lightspeed_client_id }}"
      lightspeed_client_secret: "{{ lightspeed_client_secret }}"

# -----------------------------------------------------------------------------
# Projects
# -----------------------------------------------------------------------------
controller_projects:
  - name: "Full Patching at Machine Speed"
    description: "EDA-driven enterprise full patch + reboot with ServiceNow governance"
    organization: "{{ aap_organization }}"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

# -----------------------------------------------------------------------------
# Inventories
# -----------------------------------------------------------------------------
controller_inventories:
  - name: "Full Patching Demo"
    description: "Demo RHEL instances — 3 dev + 3 prod (tag:demo=patching-full)"
    organization: "{{ aap_organization }}"

# -----------------------------------------------------------------------------
# Inventory Sources (dynamic — AWS EC2 with dev/prod grouping)
# -----------------------------------------------------------------------------
controller_inventory_sources:
  - name: "AWS EC2 Discovery Full Patch"
    inventory: "Full Patching Demo"
    source: "ec2"
    credential: "AWS Demo"
    overwrite: true
    update_on_launch: true
    source_vars:
      plugin: amazon.aws.aws_ec2
      regions:
        - eu-west-1
      filters:
        "tag:demo": patching-full
      hostnames:
        - tag:Name
      keyed_groups:
        - key: tags.env
          prefix: tag_env
      compose:
        ansible_host: public_ip_address
        ansible_user: "'ec2-user'"
        ansible_become: "true"

# -----------------------------------------------------------------------------
# Job Templates
# -----------------------------------------------------------------------------
controller_templates:
  - name: "Pre-check System Readiness Full Patch"
    description: "Gate: disk, memory, services, load, no pending reboot"
    organization: "{{ aap_organization }}"
    job_type: "run"
    project: "Full Patching at Machine Speed"
    playbook: "playbooks/precheck.yml"
    inventory: "Full Patching Demo"
    ask_limit_on_launch: true
    credentials:
      - "Demo SSH Key"

  - name: "Assess Patch Exposure"
    description: "Intelligence: kernel version, advisories, CVEs, patch availability, SBOM"
    organization: "{{ aap_organization }}"
    job_type: "run"
    project: "Full Patching at Machine Speed"
    playbook: "playbooks/assess.yml"
    inventory: "Full Patching Demo"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "Demo SSH Key"
      - "ServiceNow PDI"

  - name: "Apply Full Patch"
    description: "Package upgrade + reboot — permanent CVE remediation"
    organization: "{{ aap_organization }}"
    job_type: "run"
    project: "Full Patching at Machine Speed"
    playbook: "playbooks/patch.yml"
    inventory: "Full Patching Demo"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "Demo SSH Key"
      - "ServiceNow PDI"

  - name: "Post-checks Full Patch"
    description: "Verify reboot complete, services healthy, CVE cleared, SBOM diff, CI update"
    organization: "{{ aap_organization }}"
    job_type: "run"
    project: "Full Patching at Machine Speed"
    playbook: "playbooks/validate.yml"
    inventory: "Full Patching Demo"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "Demo SSH Key"
      - "ServiceNow PDI"

  - name: "Open Incident Full Patch"
    description: "Create security Incident in ServiceNow linked to affected CIs"
    organization: "{{ aap_organization }}"
    job_type: "run"
    project: "Full Patching at Machine Speed"
    playbook: "playbooks/snow_open_incident.yml"
    inventory: "Full Patching Demo"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow PDI"

  - name: "Open Emergency CR Full Patch"
    description: "Raise emergency CR with canary evidence, await approval for production"
    organization: "{{ aap_organization }}"
    job_type: "run"
    project: "Full Patching at Machine Speed"
    playbook: "playbooks/snow_open_cr.yml"
    inventory: "Full Patching Demo"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow PDI"

  - name: "Post-Implementation Review Full Patch"
    description: "CR to Review, update Insights CVE status as Resolved"
    organization: "{{ aap_organization }}"
    job_type: "run"
    project: "Full Patching at Machine Speed"
    playbook: "playbooks/snow_close_out.yml"
    inventory: "Full Patching Demo"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow PDI"
      - "Lightspeed API Full Patch"

  - name: "Bridge CR Approval Full Patch"
    description: "Relay ServiceNow CR approval to the paused AAP workflow node"
    organization: "{{ aap_organization }}"
    job_type: "run"
    project: "Full Patching at Machine Speed"
    playbook: "playbooks/approve_pending_workflow.yml"
    inventory: "Full Patching Demo"
    ask_variables_on_launch: true
    credentials:
      - "AAP Controller"


# -----------------------------------------------------------------------------
# Workflow: Trading Service: CVE Full Patch Response
# -----------------------------------------------------------------------------
controller_workflows:
  - name: "Trading Service: CVE Full Patch Response"
    description: >-
      EDA-triggered workflow: assess exposure, open Incidents, run canary full patch
      + reboot on dev, raise emergency CR for prod, await approval, patch+reboot prod, close ITIL records.
    organization: "{{ aap_organization }}"
    ask_variables_on_launch: true
    simplified_workflow_nodes:

      - identifier: "Assess & SBOM Baseline"
        unified_job_template: "Assess Patch Exposure"
        success_nodes:
          - "Open Incident"

      - identifier: "Open Incident"
        unified_job_template: "Open Incident Full Patch"
        success_nodes:
          - "Pre-check All Hosts"

      - identifier: "Pre-check All Hosts"
        unified_job_template: "Pre-check System Readiness Full Patch"
        success_nodes:
          - "Canary: Apply Full Patch"

      - identifier: "Canary: Apply Full Patch"
        unified_job_template: "Apply Full Patch"
        limit: "tag_env_dev"
        success_nodes:
          - "Canary: Post-checks"

      - identifier: "Canary: Post-checks"
        unified_job_template: "Post-checks Full Patch"
        limit: "tag_env_dev"
        success_nodes:
          - "Open Emergency CR"

      - identifier: "Open Emergency CR"
        unified_job_template: "Open Emergency CR Full Patch"
        success_nodes:
          - "Awaiting CR Approval"

      - identifier: "Awaiting CR Approval"
        approval_node:
          name: "Awaiting CR Approval"
          description: >-
            Workflow paused — waiting for ServiceNow emergency CR approval.
            EDA will auto-approve this node when the CR is approved in ServiceNow.
          timeout: 0
        success_nodes:
          - "Apply Full Patch (Prod)"

      - identifier: "Apply Full Patch (Prod)"
        unified_job_template: "Apply Full Patch"
        limit: "tag_env_prod"
        success_nodes:
          - "Post-checks (Prod)"

      - identifier: "Post-checks (Prod)"
        unified_job_template: "Post-checks Full Patch"
        limit: "tag_env_prod"
        success_nodes:
          - "Post-Implementation Review"

      - identifier: "Post-Implementation Review"
        unified_job_template: "Post-Implementation Review Full Patch"

# =============================================================================
# Event-Driven Ansible
# =============================================================================

eda_decision_environments:
  - name: "ServiceNow DE"
    description: "Decision environment with servicenow.itsm for CR polling"
    organization: "{{ aap_organization }}"
    image_url: "quay.io/crenwick93/snow-de:latest"

eda_projects:
  - name: "Full Patching at Machine Speed"
    description: "EDA rulebooks for full-patch CVE response and ServiceNow approval bridge"
    organization: "{{ aap_organization }}"
    url: "{{ git_repo_url }}"
    wait: true

eda_credentials:
  - name: "AAP Controller Token"
    description: "Controller credential so EDA can launch workflow templates"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "{{ aap_organization }}"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "ServiceNow EDA"
    description: "ServiceNow credentials for the EDA records source plugin"
    credential_type: "ServiceNow Credential"
    organization: "{{ aap_organization }}"
    inputs:
      SN_HOST: "{{ servicenow_instance_url }}"
      SN_USERNAME: "{{ servicenow_username }}"
      SN_PASSWORD: "{{ servicenow_password }}"

  - name: "Lightspeed CVE Events Full Patch token"
    description: "Token auth for simulated Lightspeed CVE webhook events (full patch demo)"
    credential_type: "Token Event Stream"
    organization: "{{ aap_organization }}"
    inputs:
      auth_type: token
      token: "{{ eda_event_stream_token }}"
      http_header_key: Authorization

eda_event_streams:
  - name: "Lightspeed CVE Events Full Patch token"
    organization: "{{ aap_organization }}"
    credential_name: "Lightspeed CVE Events Full Patch token"
    event_stream_type: token
    test_mode: false

eda_rulebook_activations:
  - name: "Full Patch CVE Response"
    description: "Monitors Lightspeed for CVE events and ServiceNow for CR approvals (full patch)"
    organization: "{{ aap_organization }}"
    project: "Full Patching at Machine Speed"
    rulebook: "cve_response.yml"
    decision_environment: "ServiceNow DE"
    enabled: true
    source_mappings:
      - source_name: insights_events
        event_stream_name: "Lightspeed CVE Events Full Patch token"
    eda_credentials:
      - "AAP Controller Token"
      - "ServiceNow EDA"
